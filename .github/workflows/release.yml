name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: GyaimSwift
        run: xcodegen generate

      - name: Run tests
        working-directory: GyaimSwift
        run: ./Scripts/run-unit-tests.sh

      # Release build + .pkg installer (Google 日本語入力 style, installs to
      # /Library/Input Methods). The pkg is distributed as-is; no DMG wrapper.
      # Signing is ad-hoc unless APP_IDENTITY / INSTALLER_IDENTITY are set
      # (see Scripts/build-pkg.sh).
      - name: Build installer pkg (Release)
        working-directory: GyaimSwift
        run: ./Scripts/build-pkg.sh

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            GyaimSwift/dist/*.pkg \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
